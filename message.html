<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }

        .status.connected {
            background: #4caf50;
        }

        .status.disconnected {
            background: #f44336;
        }

        .status.connecting {
            background: #ff9800;
        }

        .config-panel {
            padding: 20px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }

        .config-group {
            margin-bottom: 15px;
        }

        .config-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .config-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .config-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-connect {
            background: #4caf50;
            color: white;
        }

        .btn-connect:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn-disconnect {
            background: #f44336;
            color: white;
        }

        .btn-disconnect:hover {
            background: #da190b;
            transform: translateY(-2px);
        }

        .btn-disconnect:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 12px;
            max-width: 70%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            background: #667eea;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: #e0e0e0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message-header {
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .message-content {
            font-size: 14px;
            line-height: 1.5;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .input-group button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .input-group button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 12px;
            color: #1976d2;
        }

        .error-box {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 12px;
            color: #c62828;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 WebSocket Chat Test</h1>
            <div id="status" class="status disconnected">Disconnected</div>
        </div>

        <div class="config-panel">
            <div class="config-group">
                <label for="jwtToken">JWT Token:</label>
                <input type="text" id="jwtToken" placeholder="Enter your JWT token here">
            </div>
            <div class="config-group">
                <label for="serverUrl">Server URL:</label>
                <input type="text" id="serverUrl" value="http://localhost:3004" placeholder="Server URL">
            </div>
            <div class="config-group">
                <label for="receiverId">Receiver User ID:</label>
                <input type="number" id="receiverId" placeholder="Enter receiver user ID">
            </div>
            <div class="button-group">
                <button class="btn-connect" onclick="connect()">Connect</button>
                <button class="btn-disconnect" onclick="disconnect()" disabled>Disconnect</button>
            </div>
        </div>

        <div class="chat-panel">
            <div id="infoBox" style="display: none;"></div>
            <div id="messagesContainer" class="messages-container">
                <div class="empty-state">No messages yet. Connect and start chatting!</div>
            </div>
            <div class="input-group">
                <input type="text" id="messageInput" placeholder="Type your message..." disabled>
                <button onclick="sendMessage()" id="sendButton" disabled>Send</button>
            </div>
        </div>
    </div>

    <script>
        let stompClient = null;
        let isConnected = false;
        let currentUsername = null;
        let typingTimeout = null;
        let pendingMessages = new Set(); // Track pending optimistic messages

        function updateStatus(status, text) {
            const statusEl = document.getElementById('status');
            statusEl.className = 'status ' + status;
            statusEl.textContent = text;
        }

        function showInfo(message) {
            const infoBox = document.getElementById('infoBox');
            infoBox.className = 'info-box';
            infoBox.textContent = message;
            infoBox.style.display = 'block';
            setTimeout(() => {
                infoBox.style.display = 'none';
            }, 5000);
        }

        function showError(message) {
            const infoBox = document.getElementById('infoBox');
            infoBox.className = 'error-box';
            infoBox.textContent = 'Error: ' + message;
            infoBox.style.display = 'block';
        }

        function addMessage(message, isSent) {
            console.log('🎨 Adding message to UI:', message, 'isSent:', isSent);
            const container = document.getElementById('messagesContainer');
            
            // Remove empty state if exists
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + (isSent ? 'sent' : 'received');
            
            const header = document.createElement('div');
            header.className = 'message-header';
            const senderName = isSent ? 'You' : (message.sender || 'Unknown');
            const timestamp = message.timestamp || new Date().toLocaleTimeString();
            header.textContent = `${senderName} • ${timestamp}`;
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = message.content || message.messageContent || '';

            messageDiv.appendChild(header);
            messageDiv.appendChild(content);
            container.appendChild(messageDiv);
            
            console.log('✅ Message div created and appended');
            
            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function connect() {
            const jwtToken = document.getElementById('jwtToken').value.trim();
            const serverUrl = document.getElementById('serverUrl').value.trim();

            if (!jwtToken) {
                showError('Please enter a JWT token');
                return;
            }

            if (!serverUrl) {
                showError('Please enter server URL');
                return;
            }

            updateStatus('connecting', 'Connecting...');

            try {
                const payload = JSON.parse(atob(jwtToken.split('.')[1]));
                currentUsername = payload.sub;
                console.log('Current username from JWT:', currentUsername);
            } catch (e) {
                console.warn('Could not decode JWT payload:', e);
                currentUsername = null;
            }

            const socket = new SockJS(serverUrl + '/ws');
            stompClient = Stomp.over(socket);
            
            // Enable debug logging to see what's happening
            stompClient.debug = function(str) {
                console.log('STOMP:', str);
            };

            const headers = {
                'Authorization': 'Bearer ' + jwtToken
            };

            console.log('Attempting to connect with headers:', headers);
            stompClient.connect(headers, 
                function(frame) {
                    console.log('✅ Connected! Frame:', frame);
                    console.log('Frame headers:', frame.headers);
                    console.log('Frame command:', frame.command);
                    isConnected = true;
                    updateStatus('connected', 'Connected');
                    showInfo('Successfully connected to WebSocket!');
                    
                    document.getElementById('messageInput').disabled = false;
                    document.getElementById('sendButton').disabled = false;
                    document.querySelector('.btn-connect').disabled = true;
                    document.querySelector('.btn-disconnect').disabled = false;

                    // Subscribe immediately - Spring should resolve /user/queue/messages to current user
                    console.log('📡 Current username from JWT:', currentUsername);
                    console.log('📡 Subscribing to /user/queue/messages (Spring will resolve to /user/' + currentUsername + '/queue/messages)');
                    
                    // Subscribe with headers to ensure authentication
                    const subscribeHeaders = {
                        'Authorization': 'Bearer ' + jwtToken
                    };
                    
                    // Primary subscription - Spring auto-resolves based on authenticated user
                    const messageSubscription = stompClient.subscribe('/user/queue/messages', function(message) {
                        console.log('✅✅✅ MESSAGE RECEIVED! ✅✅✅');
                        console.log('Subscription path: /user/queue/messages');
                        console.log('Raw message:', message);
                        console.log('Message body:', message.body);
                        console.log('Message command:', message.command);
                        console.log('Message headers:', message.headers);
                        
                        try {
                            const chatMessage = JSON.parse(message.body);
                            console.log('✅ Parsed chat message:', chatMessage);
                            console.log('Message sender:', chatMessage.sender);
                            console.log('Current username:', currentUsername);
                            console.log('Sender ID:', chatMessage.senderId, '| Receiver ID:', chatMessage.receiverId);
                            
                            // Determine if message is sent or received
                            const isSent = chatMessage.senderId != null &&
                               chatMessage.senderId.toString() === getMyUserId();

                            console.log('Is sent by me?', isSent);
                            
                            // If this is a sent message with an ID, remove from pending
                            if (isSent && chatMessage.senderId) {
                                const messageKey = chatMessage.content + chatMessage.timestamp;
                                pendingMessages.delete(messageKey);
                                console.log('Removed from pending:', messageKey);
                            }
                            
                            addMessage(chatMessage, isSent);
                            console.log('✅ Message added to UI');
                        } catch (e) {
                            console.error('❌ Error parsing message:', e);
                            console.error('Raw message body:', message.body);
                            showError('Error parsing received message: ' + e.message);
                        }
                    }, subscribeHeaders);
                    console.log('✅ Subscription created:', messageSubscription);
                    console.log('Subscription ID:', messageSubscription.id);
                    console.log('Subscription headers:', subscribeHeaders);
                    console.log('✅ Ready to receive messages on /user/queue/messages');
                    
                    // Also subscribe to typing with headers
                    stompClient.subscribe('/user/queue/typing', function(message) {
                        try {
                            const typing = JSON.parse(message.body);
                            if (!typing || typing.senderId == getMyUserId()) return;

                            showInfo(`User ${typing.senderId} is typing...`);
                        } catch (e) {
                            console.error('Typing parse error', e);
                        }
                    });


                    stompClient.subscribe('/topic/public', function(message) {
                        const chatMessage = JSON.parse(message.body);
                        if (chatMessage.type === 'JOIN') {
                            showInfo(`${chatMessage.sender} joined the chat`);
                        }
                    });
                },
                function(error) {
                    console.error('Connection error:', error);
                    isConnected = false;
                    updateStatus('disconnected', 'Connection Failed');
                    showError('Failed to connect: ' + (error.headers?.message || error));
                    
                    document.getElementById('messageInput').disabled = true;
                    document.getElementById('sendButton').disabled = true;
                    document.querySelector('.btn-connect').disabled = false;
                    document.querySelector('.btn-disconnect').disabled = true;
                }
            );
        }

        function getMyUserId() {
            try {
                const jwt = document.getElementById('jwtToken').value;
                return JSON.parse(atob(jwt.split('.')[1])).userId.toString();
            } catch {
                return null;
            }
        }


        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
                stompClient = null;
            }
            isConnected = false;
            updateStatus('disconnected', 'Disconnected');
            showInfo('Disconnected from WebSocket');
            
            document.getElementById('messageInput').disabled = true;
            document.getElementById('sendButton').disabled = true;
            document.querySelector('.btn-connect').disabled = false;
            document.querySelector('.btn-disconnect').disabled = true;

            const container = document.getElementById('messagesContainer');
            container.innerHTML = '<div class="empty-state">No messages yet. Connect and start chatting!</div>';
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const receiverId = document.getElementById('receiverId').value.trim();
            const message = messageInput.value.trim();
            
            // FIX 1: Get token from the input field since 'jwtToken' var is not in scope here
            const token = document.getElementById('jwtToken').value.trim();

            if (!isConnected) {
                showError('Not connected to WebSocket');
                return;
            }

            if (!message) {
                showError('Please enter a message');
                return;
            }

            if (!receiverId) {
                showError('Please enter receiver user ID');
                return;
            }

            const chatMessage = {
                type: 'MESSAGE',
                content: message,
                receiverId: parseInt(receiverId),
                senderId: parseInt(getMyUserId())
            };

            console.log('📤 Sending message:', chatMessage);
            
            const headers = {
                'Authorization': 'Bearer ' + token
            };
        
            // Add message to UI immediately (optimistic update)
            // This ensures the user sees their message right away
            const messageKey = message + new Date().toLocaleTimeString();
            pendingMessages.add(messageKey);
            
            const optimisticMessage = {
                content: message,
                sender: currentUsername,
                senderId: null, // Will be updated when server responds
                receiverId: parseInt(receiverId),
                timestamp: new Date().toLocaleTimeString(),
                type: 'MESSAGE'
            };
            addMessage(optimisticMessage, true);
            console.log('✅ Optimistic message added to UI');
            
            stompClient.send('/app/chat.send', headers, JSON.stringify(chatMessage));
            console.log('✅ Message sent to /app/chat.send');
            
            // Clear input
            messageInput.value = '';
        }

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        document.getElementById('messageInput').addEventListener('input', function() {
            if (!isConnected) return;
            
            const receiverId = document.getElementById('receiverId').value.trim();
            const token = document.getElementById('jwtToken').value.trim(); // Get token for headers
            
            if (!receiverId) return;

            const typingMessage = {
                type: 'TYPING',
                sender: currentUsername, 
                receiverId: parseInt(receiverId)
            };

            // Added headers to typing event for consistency
            const headers = {
                'Authorization': 'Bearer ' + token
            };

            stompClient.send("/app/chat.typing", headers, JSON.stringify(typingMessage));
        });

        window.addEventListener('load', function() {
            const savedToken = localStorage.getItem('jwtToken');
            if (savedToken) {
                document.getElementById('jwtToken').value = savedToken;
            }
        });

        document.getElementById('jwtToken').addEventListener('change', function() {
            localStorage.setItem('jwtToken', this.value);
        });
    </script>
</body>
</html>
